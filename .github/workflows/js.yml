name: JS

# Single, unified JavaScript pipeline that subsumes the previous test.yml,
# pages.yml, links.yml, and release.yml responsibilities. Structured to fail
# fast: cheap checks (syntax-check, unit tests, link audit) gate the slower jobs
# (e2e against a locally-served build, Pages deploy, e2e against the deployed
# site, npm publish, Docker publish).
#
# Layout adopted from link-foundation/js-ai-driven-development-pipeline-template
# (release.yml), kept in this repository as js.yml per PR review:
#   * npm publish is gated on package.json version bumps
#   * Docker publish targets ghcr.io
#   * changeset PR and manual release jobs are deferred
# The template's `detect-changes` matrix is intentionally omitted: every job
# below already either runs in <1 minute or is gated by a `needs:` chain,
# so partial skipping wouldn't meaningfully improve wall time and would
# add a lot of yaml.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Publish even if package.json version is unchanged'
        type: boolean
        default: false

# Cancel in-flight runs for the same ref so the latest commit wins on
# `main` and on PR force-pushes. Matches the template's policy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

# Default permissions are read-only; Pages deploy job widens scope below.
permissions:
  contents: read

jobs:
  # === Fast checks ============================================================

  syntax-check:
    name: Syntax check (node --check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      - name: Walk repo and run node --check
        run: node js/scripts/check-mjs-syntax.mjs

  unit-tests:
    name: Unit tests (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [syntax-check]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci
      - name: Run unit and integration suites
        # `run-unit-tests.mjs` distinguishes gating node:test suites
        # (including dependency-backed config/cache tests) from informational
        # (live-Wikidata cache/transformer scripts). Only gating failures
        # set a non-zero exit code.
        run: node js/scripts/run-unit-tests.mjs

  link-check:
    name: Broken link check (lychee)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check links with lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --cache
            --max-cache-age 1d
            --max-retries 3
            --timeout 30
            --exclude-path docs/case-studies
            './**/*.md'
            './**/*.html'
          fail: false
          output: lychee/out.md
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check broken links against Web Archive
        if: steps.lychee.outputs.exit_code != 0
        id: webarchive
        run: node js/scripts/check-web-archive.mjs
        env:
          LYCHEE_OUTPUT: lychee/out.md
      - name: Fail if broken links found and no web archive fallback
        if: steps.lychee.outputs.exit_code != 0 && steps.webarchive.outputs.all_archived != 'true'
        run: |
          echo "::error::Broken links were detected with no Web Archive fallback available."
          echo "See the 'Check links with lychee' step for the full list and lychee/out.md."
          exit 1

  # === E2E against locally-served build (PR + push gate) =====================

  e2e-local:
    name: E2E (Playwright @ localhost)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e suite (boots js/scripts/serve-static.mjs)
        run: node js/scripts/run-e2e-local.mjs
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # === GitHub Pages build & deploy (main only) ===============================

  pages-build:
    name: Pages build (Jekyll)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [syntax-check, unit-tests, e2e-local, link-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  pages-deploy:
    name: Pages deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [pages-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      # Exposed so the e2e-deployed job can reuse the freshly deployed URL.
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # === Post-deploy e2e against the live GitHub Pages site ====================
  # Runs the same Playwright suite against the just-deployed site. Most
  # assertions are wiring/DOM checks that don't depend on live Wikidata,
  # so they're stable on the public Pages URL.

  e2e-deployed:
    name: E2E (Playwright @ deployed Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [pages-deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Wait for new content to propagate
        # Pages CDN can lag the deploy step by a few seconds.
        run: sleep 10
      - name: Run e2e suite against the deployed site
        env:
          BASE_URL: ${{ needs.pages-deploy.outputs.page_url || 'https://link-assistant.github.io/human-language' }}
        run: npx playwright test --config js/tests/e2e/playwright.config.mjs
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-deployed
          path: playwright-report/
          retention-days: 7

  # === npm + Docker release (main only) =====================================

  detect-version-bump:
    name: Detect package.json version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-tests, e2e-local, link-check]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      should_publish: ${{ steps.diff.outputs.should_publish }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        name: Compare versions
        run: node js/scripts/check-package-version.mjs
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          FORCE_PUBLISH: ${{ inputs.force_publish }}

  publish-npm:
    name: npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-version-bump, unit-tests]
    if: needs.detect-version-bump.outputs.should_publish == 'true'
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/human-language
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Verify npm package
        run: npm pack --dry-run
      - name: npm publish --provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    name: Docker build (${{ matrix.arch }})
    timeout-minutes: 20
    needs: [detect-version-bump, unit-tests]
    if: needs.detect-version-bump.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/human-language
          labels: |
            org.opencontainers.image.version=${{ needs.detect-version-bump.outputs.version }}
            org.opencontainers.image.source=https://github.com/link-assistant/human-language
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/human-language,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: human-language-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-docker-manifest:
    name: Docker publish (multi-platform manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-version-bump, publish-docker]
    if: needs.detect-version-bump.outputs.should_publish == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: human-language-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/human-language
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.detect-version-bump.outputs.version }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/human-language@sha256:%s ' *)
      - name: Verify both platforms were published
        run: |
          image="ghcr.io/${{ github.repository_owner }}/human-language:${{ needs.detect-version-bump.outputs.version }}"
          docker buildx imagetools inspect --raw "$image" > /tmp/manifest.json
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64")' /tmp/manifest.json
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")' /tmp/manifest.json
      - name: Verify the GHCR package is anonymously pullable
        env:
          GHCR_IMAGE: ghcr.io/link-assistant/human-language
        run: bash scripts/verify-ghcr-visibility.sh

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Registry availability must not withhold a release whose package passed
    # every code and npm publication gate.
    needs: [detect-version-bump, publish-npm]
    if: needs.detect-version-bump.outputs.should_publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-version-bump.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --latest
