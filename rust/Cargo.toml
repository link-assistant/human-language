[package]
name = "human-language"
version = "0.2.2"
edition = "2021"
rust-version = "1.85"
description = "Data-driven language detection and metadata, with no_std + alloc helpers for tokenization, Wikidata Q/P Links Notation, and hash routing."
license = "MIT"
repository = "https://github.com/link-assistant/human-language"
homepage = "https://github.com/link-assistant/human-language"
documentation = "https://docs.rs/human-language"
readme = "README.md"
keywords = ["wikidata", "nlp", "links-notation", "lino", "tokenizer"]
categories = ["text-processing", "parser-implementations", "command-line-utilities"]
authors = ["link-assistant"]

[lib]
name = "human_language"
crate-type = ["rlib"]

[[bin]]
name = "human-language"
path = "src/bin/cli.rs"
required-features = ["std"]

[[example]]
name = "language-detection"
path = "examples/language-detection.rs"
required-features = ["std"]

[features]
default = ["std"]
# CLI, configuration codec, and thread-local forced-language guards.
std = ["dep:clap", "dep:lino-arguments", "dep:lino-objects-codec", "percent-encoding/std"]
# Network-backed Wikidata client (reqwest + tokio). Kept opt-in so the core
# crate compiles without an async runtime when used only for pure helpers.
wikidata-client = ["std", "dep:reqwest", "dep:tokio", "dep:serde", "dep:serde_json"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"], optional = true }
lino-arguments = { version = "0.3.0", optional = true }
lino-objects-codec = { version = "0.2.1", optional = true }
percent-encoding = { version = "2", default-features = false, features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"], optional = true }

[dev-dependencies]
serde_json = "1"
